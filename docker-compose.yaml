services:

  # -----------------------------------------------------------------------
  # CONFIGURATION & DISCOVERY
  # -----------------------------------------------------------------------

  ms-config:
    build: ./backend/ms-config
    container_name: ms-config-server
    ports:
      - "8888:8888"
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ms-discover:
    build: ./backend/ms-discover
    container_name: ms-discover-server
    ports:
      - "8761:8761"
    networks:
      - microservices-net
    restart: unless-stopped
    depends_on:
      ms-config:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://ms-config:8888

  ms-gateway:
    build: ./backend/ms-gateway
    container_name: ms-gateway-server
    ports:
      - "8088:8088"
    networks:
      - microservices-net
    restart: unless-stopped
    depends_on:
      ms-config:
        condition: service_healthy
      ms-discover:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # -----------------------------------------------------------------------
  # IDENTITY PROVIDER
  # -----------------------------------------------------------------------

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "9090:8080" 
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks:
      - microservices-net
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # MICROSERVICES
  # -----------------------------------------------------------------------

  service-user:
    build:
      context: .
      dockerfile: backend/service-user/Dockerfile
    container_name: service-user
    ports:
      - "8081:8081"
    environment:
      - SPRING_APPLICATION_NAME=service-user 
      - CONFIG_SERVER_URL=http://ms-config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://ms-discover:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://ms-config:8888
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/gestion-etudiants
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=gestion-etudiants
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KEYCLOAK_ADMIN_CLIENT_ID=admin-cli
    depends_on:
      ms-config:
        condition: service_healthy
      ms-discover:
        condition: service_healthy
      keycloak:
        condition: service_started
      service-user-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - microservices-net
    restart: always

  ms-etudiant:
    build:
      context: .
      dockerfile: backend/ms-etudiant/Dockerfile
    container_name: ms-etudiant
    ports:
      - "8082:8082"
    depends_on:
      ms-config:
        condition: service_healthy
      ms-discover:
        condition: service_healthy
      ms-etudiant-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - microservices-net
    restart: unless-stopped

  ms-classe:
    build:
      context: .
      dockerfile: backend/ms-classe/Dockerfile
    container_name: ms-classe
    ports:
      - "8083:8083"
    depends_on:
      ms-config:
        condition: service_healthy
      ms-discover:
        condition: service_healthy
      ms-classe-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - microservices-net
    restart: unless-stopped

  ms-enseignant:
    build:
      context: .
      dockerfile: backend/ms-enseignant/Dockerfile
    container_name: ms-enseignant
    ports:
      - "8084:8084"
    depends_on:
      ms-config:
        condition: service_healthy
      ms-discover:
        condition: service_healthy
      ms-enseignant-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - microservices-net
    restart: unless-stopped

  ms-note:
    build:
      context: .
      dockerfile: backend/ms-note/Dockerfile
    container_name: ms-note
    ports:
      - "8085:8085"
    depends_on:
      ms-config:
        condition: service_healthy
      ms-discover:
        condition: service_healthy
      ms-note-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - microservices-net
    restart: unless-stopped
  


  # -----------------------------------------------------------------------
  # DATABASES
  # -----------------------------------------------------------------------

  service-user-db:
    image: mariadb:11
    container_name: service-user-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_user
      MYSQL_USER: user
      MYSQL_PASSWORD: passer123
    ports:
      - "3308:3306"
    volumes:
      - service-user-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 60s
    command: 
      - --wait-timeout=28800
      - --interactive-timeout=28800
    networks:
      - microservices-net
    restart: unless-stopped

  ms-etudiant-db:
    image: mariadb:11
    container_name: ms-etudiant-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_etudiant
      MYSQL_USER: etudiant_user
      MYSQL_PASSWORD: passer123
    ports:
      - "3309:3306"
    volumes:
      - ms-etudiant-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 60s
    command: 
      - --wait-timeout=28800
      - --interactive-timeout=28800
    networks:
      - microservices-net
    restart: unless-stopped

  ms-classe-db:
    image: mariadb:11
    container_name: ms-classe-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_classe
      MYSQL_USER: classe_user
      MYSQL_PASSWORD: passer123
    ports:
      - "3310:3306"
    volumes:
      - ms-classe-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 60s
    command: 
      - --wait-timeout=28800
      - --interactive-timeout=28800
    networks:
      - microservices-net
    restart: unless-stopped

  ms-enseignant-db:
    image: mariadb:11
    container_name: ms-enseignant-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_enseignant
      MYSQL_USER: enseignant_user
      MYSQL_PASSWORD: passer123
    ports:
      - "3311:3306"
    volumes:
      - ms-enseignant-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 60s
    command: 
      - --wait-timeout=28800
      - --interactive-timeout=28800
    networks:
      - microservices-net
    restart: unless-stopped

  ms-note-db:
    image: mariadb:11
    container_name: ms-note-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_note
      MYSQL_USER: note_user
      MYSQL_PASSWORD: passer123
    ports:
      - "3312:3306"
    volumes:
      - ms-note-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 60s
    command: 
      - --wait-timeout=28800
      - --interactive-timeout=28800
    networks:
      - microservices-net
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # TOOLS (PhpMyAdmin)
  # -----------------------------------------------------------------------

  phpmyadmin-user:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-user
    environment:
      PMA_HOST: service-user-db
      PMA_PORT: 3306
    ports:
      - "9099:80"
    depends_on:
      - service-user-db
    networks:
      - microservices-net
    restart: unless-stopped

  phpmyadmin-etudiant:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-etudiant
    environment:
      PMA_HOST: ms-etudiant-db
      PMA_PORT: 3306
    ports:
      - "9096:80"
    depends_on:
      - ms-etudiant-db
    networks:
      - microservices-net
    restart: unless-stopped

  phpmyadmin-classe:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-classe
    environment:
      PMA_HOST: ms-classe-db
      PMA_PORT: 3306
    ports:
      - "9093:80"
    depends_on:
      - ms-classe-db
    networks:
      - microservices-net
    restart: unless-stopped

  phpmyadmin-enseignant:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-enseignant
    environment:
      PMA_HOST: ms-enseignant-db
      PMA_PORT: 3306
    ports:
      - "9094:80"
    depends_on:
      - ms-enseignant-db
    networks:
      - microservices-net
    restart: unless-stopped

  phpmyadmin-note:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-note
    environment:
      PMA_HOST: ms-note-db
      PMA_PORT: 3306
    ports:
      - "9095:80"
    depends_on:
      - ms-note-db
    networks:
      - microservices-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-ui
    ports:
    - "3000:80"  # Changé de 3000:3000 à 3000:80
  # Supprimez les volumes de développement (sauf si nécessaire pour le dev)
  # volumes:
  #   - ./frontend:/app
  #   - /app/node_modules
    depends_on:
      ms-gateway:
        condition: service_healthy
    environment:
      - VITE_API_BASE_URL=http://localhost:8088  # URL du gateway
    networks:
      - microservices-net
    restart: unless-stopped

networks:
  microservices-net:
    driver: bridge

volumes:
  service-user-db-data:
  ms-etudiant-db-data:
  ms-classe-db-data:
  ms-enseignant-db-data:
  ms-note-db-data:
  keycloak-data: