x-service-defaults: &service-defaults
  networks:
    - microservices-net
  restart: unless-stopped

services:


#Les services de l’architecture microservices

  # CONFIG SERVER
  ms-config:
    <<: *service-defaults
    build: ./backend/ms-config
    container_name: ms-config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  
  # DISCOVERY SERVER (Eureka)
  ms-discover:
    <<: *service-defaults
    build: ./backend/ms-discover
    container_name: ms-discover-server
    ports:
      - "8761:8761"
    depends_on:
      ms-config:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  
  # GATEWAY SERVER
  ms-gateway:
    <<: *service-defaults
    build: ./backend/ms-gateway
    container_name: ms-gateway-server
    ports:
      - "8088:8088"
    depends_on:
      ms-config:
        condition: service_healthy
      ms-discover:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


